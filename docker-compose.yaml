name: react_laravel_deploy_appservices:  mysql:    image: mysql:8.0    env_file: .env.docker    volumes:      - mysql-data:/var/lib/mysql      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro    healthcheck:      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\ --silent"]      interval: 5s      timeout: 5s      retries: 20      start_period: 30s  app:    build:      context: .      dockerfile: docker/php/Dockerfile      target: prod    env_file: .env.docker    depends_on:      mysql:        condition: service_healthy    healthcheck:      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_NAME=/pong  cgi-fgi -bind -connect 127.0.0.1:9000 | grep -q pong"]      interval: 10s      timeout: 5s      retries: 5      start_period: 30s